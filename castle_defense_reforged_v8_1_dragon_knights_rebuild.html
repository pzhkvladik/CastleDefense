<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Castle Defense — Reforged</title>
<style>
:root{
  --bg:#0b0f16;
  --panel:#101722ee;
  --panel2:#1b2535;
  --border:#ffffff17;
  --text:#f7f0dc;
  --muted:#aab5c5;
  --gold:#ffd563;
  --red:#ff6868;
  --green:#82db83;
  --blue:#91d7ff;
}
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif
}
#app{height:100%;display:grid;grid-template-rows:1fr auto}
#stage{position:relative;min-height:0;background:#0d1219}
canvas{
  display:block;width:100%;height:100%;touch-action:none;
  image-rendering:pixelated;image-rendering:crisp-edges
}
#hud{
  position:absolute;left:12px;right:12px;top:11px;z-index:5;
  display:flex;justify-content:space-between;gap:8px;pointer-events:none
}
#speedControls{
  display:flex;gap:5px;pointer-events:auto;
}
.speedBtn{
  min-height:auto;padding:7px 9px;border-radius:10px;
  font-size:11px;font-weight:950;line-height:1;
  background:linear-gradient(180deg,#26334a,#17202f);
}
.speedBtn.active{
  background:linear-gradient(180deg,#6c5430,#3b2f20);
  border-color:#ffd56a88;color:#ffd96f;
  box-shadow:0 0 0 1px #ffd56a22 inset,0 5px 14px #0005;
}
.hudSide{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  background:linear-gradient(180deg,#172235ee,#0e1623ee);
  border:1px solid var(--border);border-radius:13px;padding:8px 11px;
  box-shadow:0 7px 20px #0006,inset 0 1px #ffffff0d;
  backdrop-filter:blur(6px);font-size:12px;font-weight:900;text-shadow:0 2px 3px #000
}
.gold{color:var(--gold)}
.perkBar{
  display:flex;align-items:center;gap:5px;min-height:32px;pointer-events:auto
}
.perkIcon{
  position:relative;display:flex;align-items:center;justify-content:center;
  min-width:30px;height:30px;padding:0 6px;border-radius:9px;
  background:linear-gradient(180deg,#202d43ee,#111a28ee);
  border:1px solid #ffffff1d;box-shadow:0 5px 15px #0005;
  font-size:15px;font-weight:950;cursor:help;text-shadow:0 2px 3px #000
}
.perkIcon .perkCount{
  margin-left:3px;font-size:9px;color:#ffd563;font-weight:1000
}
.perkIcon::after{
  content:attr(data-tip);
  position:absolute;left:0;top:calc(100% + 8px);z-index:30;
  width:220px;padding:8px 10px;border-radius:10px;
  background:#0b1220f5;border:1px solid #ffffff20;color:#eef3f7;
  font-size:10px;line-height:1.4;font-weight:700;text-shadow:none;
  box-shadow:0 10px 28px #0009;white-space:normal;
  opacity:0;transform:translateY(-3px);pointer-events:none;transition:.14s
}
.perkIcon:hover::after{opacity:1;transform:translateY(0)}
#message{
  position:absolute;left:50%;top:65px;transform:translate(-50%,-8px);z-index:6;
  background:#0c1422ef;border:1px solid #ffffff20;border-radius:15px;
  padding:10px 16px;font-weight:900;box-shadow:0 10px 26px #0007;
  opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
#message.show{opacity:1;transform:translate(-50%,0)}
#bossWrap{
  position:absolute;top:63px;left:50%;transform:translateX(-50%);
  width:min(460px,78vw);display:none;z-index:5;pointer-events:none
}
#bossTitle{text-align:center;font-size:11px;font-weight:900;margin-bottom:4px;text-shadow:0 2px 3px #000}
.bossBar{height:14px;padding:2px;border-radius:999px;background:#251112;box-shadow:0 4px 12px #0007}
#bossFill{height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,#e54848,#f2a24d)}
#waveBanner{
  position:absolute;left:50%;top:22%;transform:translateX(-50%) scale(.92);z-index:4;
  font-weight:1000;font-size:30px;letter-spacing:.04em;text-shadow:0 4px 12px #000;
  opacity:0;pointer-events:none;transition:.25s
}
#waveBanner.show{opacity:1;transform:translateX(-50%) scale(1)}
.rewardOverlay{
  position:absolute;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;
  background:#070c13dc;opacity:0;pointer-events:none;transition:.22s;padding:18px
}
.rewardOverlay.show{opacity:1;pointer-events:auto}
.rewardCard{
  width:min(720px,95vw);background:linear-gradient(180deg,#182335,#0e1622);
  border:1px solid #ffffff22;border-radius:24px;padding:22px;
  box-shadow:0 24px 80px #000a;text-align:center
}
.rewardTitle{font-size:27px;font-weight:1000}
.rewardSub{color:#aab5c5;margin-top:5px;margin-bottom:16px}
.rewardChoices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rewardChoice{min-height:118px}
.rewardChoice b{display:block;font-size:14px;margin-bottom:5px}
.rewardChoice span{display:block;color:#b9c4d3;font-size:11px;line-height:1.35}
@media(max-width:650px){.rewardChoices{grid-template-columns:1fr}}
#overlay{
  position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:#080d15da;opacity:0;pointer-events:none;transition:.22s;padding:18px
}
#overlay.show{opacity:1;pointer-events:auto}
.card{
  width:min(520px,94vw);background:linear-gradient(180deg,#172131,#101722);
  border:1px solid #ffffff20;border-radius:22px;padding:24px;text-align:center;
  box-shadow:0 24px 80px #0009
}
.card h1{margin:0 0 8px;font-size:31px}
.card p{margin:0 0 16px;color:var(--muted)}
#shop{
  display:grid;grid-template-columns:repeat(15,minmax(116px,1fr));gap:7px;
  padding:9px;background:linear-gradient(180deg,#101722,#090e15);
  border-top:1px solid #ffffff12;overflow-x:auto
}
button{
  min-height:66px;padding:8px;border-radius:13px;border:1px solid #ffffff15;
  background:linear-gradient(180deg,#24334b,#172131);color:white;cursor:pointer;
  box-shadow:0 5px 14px #0005,inset 0 1px #ffffff0d;transition:.13s;font:inherit
}
button:hover{transform:translateY(-1px);border-color:#ffffff2f}
button:active{transform:translateY(1px)}
button:disabled{opacity:.38;filter:saturate(.45);cursor:not-allowed;transform:none}
button .name{display:block;font-weight:950;font-size:12px}
button .desc{display:block;font-size:10px;color:#b5c0d2;margin-top:2px}
button .price{display:block;font-size:11px;color:var(--gold);font-weight:950;margin-top:3px}
.mainBtn{min-height:auto;padding:12px 19px;font-weight:900}
@media(max-width:820px){
  #shop{grid-template-columns:repeat(7,130px)}
  .pill{font-size:11px;padding:7px 9px}
  #message{font-size:12px;top:60px}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="hudSide">
        <div class="pill">🏰 Ворота: <span id="hp">300/300</span></div>
        <div class="pill">🌊 Хвиля: <span id="wave">1</span></div>
        <div class="pill">🍃 <span id="seasonLabel">Весна</span></div>
        <div class="pill">🧱 Башти: <span id="towerHp">180/180</span></div>
        <div id="perkBar" class="perkBar"></div>
        <div class="pill">⚔️ <span id="eventLabel">Звичайна хвиля</span></div>
      </div>
      <div class="hudSide">
        <div id="speedControls">
          <button class="speedBtn active" data-speed="1" onclick="setGameSpeed(1)">×1</button>
          <button class="speedBtn" data-speed="2" onclick="setGameSpeed(2)">×2</button>
          <button class="speedBtn" data-speed="4" onclick="setGameSpeed(4)">×4</button>
        </div>
        <div class="pill gold">🪙 <span id="gold">220</span></div>
        <div class="pill">💀 <span id="kills">0</span></div>
      </div>
    </div>

    <div id="message"></div>
    <div id="waveBanner"></div>

    <div id="bossWrap">
      <div id="bossTitle">👑 WARLORD GOBLIN</div>
      <div class="bossBar"><div id="bossFill"></div></div>
    </div>

    <div id="rewardOverlay" class="rewardOverlay">
      <div class="rewardCard">
        <div class="rewardTitle">Скриня боса</div>
        <div class="rewardSub">Обери один постійний бонус</div>
        <div id="rewardChoices" class="rewardChoices"></div>
      </div>
    </div>

    <div id="overlay">
      <div class="card">
        <h1>Замок пав</h1>
        <p id="resultText"></p>
        <button class="mainBtn" onclick="restartGame()">⚔️ Спробувати ще раз</button>
      </div>
    </div>
  </div>

  <div id="shop">
    <button id="gateBtn" onclick="buyGate()"></button>
    <button id="archerBtn" onclick="buyArcher()"></button>
    <button id="archerUpBtn" onclick="upgradeArchers()"></button>
    <button id="riverBtn" onclick="buyRiver()"></button>
    <button id="lavaBtn" onclick="buyLava()"></button>
    <button id="mageBtn" onclick="buyMage()"></button>
    <button id="repairBtn" onclick="repairGate()"></button>
    <button id="ballistaBtn" onclick="buyBallista()"></button>
    <button id="catapultBtn" onclick="buyCatapult()"></button>
    <button id="oilBtn" onclick="buyOil()"></button>
    <button id="trapsBtn" onclick="buyTraps()"></button>
    <button id="knightsBtn" onclick="deployKnights()"></button>
    <button id="towerRepairBtn" onclick="repairTowers()"></button>
    <button id="castleBtn" onclick="upgradeCastle()"></button>
    <button id="techBtn" onclick="buyTech()"></button>
  </div>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

let W=1280,H=720,DPR=1,last=0,time=0,gameSpeed=1;
function resize(){
  const r=canvas.getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.floor(r.width*DPR);
  canvas.height=Math.floor(r.height*DPR);
  W=r.width;H=r.height;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);
resize();

const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;

// Stable pseudo-random value for scenery.
// Important: unlike Math.random(), this returns the same value every frame,
// so mountains/trees/textures never jitter.
function hash01(n){
  const x=Math.sin(n*127.1+311.7)*43758.5453123;
  return x-Math.floor(x);
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
}

let game;
const enemies=[],arrows=[],enemyArrows=[],stones=[],particles=[],texts=[],clouds=[],lightnings=[],alligators=[],birds=[],knights=[];
let archerTimers=[0,0,0];

function groundY(){return H*.80}
function castleX(){return Math.max(150,W*.16)}
function gateX(){return castleX()+92}
function spawnX(){return W+80}

function riverBounds(){
  const left=W*.52;
  const width=W*.16;
  return {left,right:left+width,width,center:left+width/2};
}
function bridgePoint(){
  const b=riverBounds();
  return {x:b.center,y:groundY()-5};
}

const SEASONS=[
  {
    id:'spring',name:'Весна',icon:'🍃',
    goblinSkin:'#789f49',goblinDark:'#638238',cloth:'#4b3a2e',
    hill:'#668377',hill2:'#405b48',ground1:'#667949',ground2:'#34412e',
    skyTop:'#355f82',skyMid:'#628da8',skyLow:'#9eb7aa',skyBottom:'#c9bc88',
    treeA:'#35553d',treeB:'#2e4a38',
    bossName:'Mossback King',bossColor:'#6f923f',bossAccent:'#6f5131',
    hpMul:1.00,speedMul:1.00,damageMul:1.00
  },
  {
    id:'summer',name:'Літо',icon:'☀️',
    goblinSkin:'#789341',goblinDark:'#5f7432',cloth:'#633e27',
    hill:'#76866b',hill2:'#4d6240',ground1:'#7b8144',ground2:'#44472d',
    skyTop:'#376f9d',skyMid:'#6fa7bf',skyLow:'#b9cab0',skyBottom:'#d6bd72',
    treeA:'#365936',treeB:'#29452f',
    bossName:'Ash Warlord',bossColor:'#71873d',bossAccent:'#9b482d',
    hpMul:1.08,speedMul:1.06,damageMul:1.06
  },
  {
    id:'autumn',name:'Осінь',icon:'🍂',
    goblinSkin:'#7f9144',goblinDark:'#656f35',cloth:'#5b382b',
    hill:'#806f61',hill2:'#54483d',ground1:'#79633e',ground2:'#413528',
    skyTop:'#506b7d',skyMid:'#8b8c8a',skyLow:'#b8a27f',skyBottom:'#c79055',
    treeA:'#704b32',treeB:'#8a5a35',
    bossName:'Rotfang Chieftain',bossColor:'#7b8540',bossAccent:'#6e3445',
    hpMul:1.17,speedMul:1.03,damageMul:1.12
  },
  {
    id:'winter',name:'Зима',icon:'❄️',
    goblinSkin:'#719089',goblinDark:'#5c7470',cloth:'#35404c',
    hill:'#637987',hill2:'#475a67',ground1:'#c6d1cf',ground2:'#8d9c9d',
    skyTop:'#536d88',skyMid:'#7f98aa',skyLow:'#b9c8d1',skyBottom:'#d8dedb',
    treeA:'#41515a',treeB:'#33424a',
    bossName:'Frostfang Tyrant',bossColor:'#6d8f8c',bossAccent:'#3f6282',
    hpMul:1.28,speedMul:.96,damageMul:1.18
  }
];

function seasonIndexForWave(w){
  return Math.floor((w-1)/4)%4;
}
function currentSeason(){
  return SEASONS[seasonIndexForWave(game.wave)];
}
function seasonCycleNumber(w){
  return Math.floor((w-1)/16);
}

function archerSlot(i){
  const x=castleX(),gy=groundY();
  // All archers stand on the main wall. Mage owns the left tower.
  const slots=[
    {x:x-70,feetY:gy-248,flip:false},
    {x:x-8, feetY:gy-248,flip:false},
    {x:x+53,feetY:gy-248,flip:false}
  ];
  return slots[i]||slots[0];
}

// ---------------- GAME ----------------
function newGame(){
  enemies.length=0;arrows.length=0;enemyArrows.length=0;stones.length=0;knights.length=0;particles.length=0;texts.length=0;
  clouds.length=0;lightnings.length=0;alligators.length=0;birds.length=0;
  archerTimers=[0,0,0];

  game={
    gold:190,kills:0,wave:1,
    gateLevel:1,gateMax:300,gateHp:300,
    archers:0,archerLevel:1,
    river:false,riverLevel:0,
    bridge:{active:false,building:false,buildProgress:0,hp:0,maxHp:0,collapse:0},
    builderSpawned:false,
    lava:false,lavaLevel:0,lavaCooldown:0,lavaPour:0,
    mage:false,mageLevel:0,mageCooldown:2,
    towerMax:180,towerHp:180,
    ballista:0,ballistaTimer:0,
    catapult:0,catapultTimer:0,
    oil:0,oilCooldown:0,oilPour:0,
    traps:0,trapCooldown:0,
    knightLevel:0,knightCooldown:0,
    castleLevel:1,techLevel:0,
    critChance:.08,critDamage:1.75,
    goldBonus:0,damageBonus:0,rangeBonus:0,waveGoldBonus:0,
    perks:{},
    ballistaKick:0,catapultKick:0,
    towerDestroyedNotified:false,
    archerSlow:0,
    corpseSouls:0,
    event:'normal',eliteWave:false,goldWave:false,
    pausedForReward:false,rewardPending:false,
    spawnTimer:1.25,spawned:0,waveTotal:8,wavePause:0,
    boss:null,gameOver:false,shake:0,flash:0,slowmo:0,
    waveBanner:0
  };

  for(let i=0;i<5;i++) birds.push({x:rand(0,W),y:rand(70,H*.34),speed:rand(8,18),phase:rand(0,TAU)});
  updateShop();
  syncHUD();
}
function setGameSpeed(speed){
  gameSpeed=speed;
  document.querySelectorAll('.speedBtn').forEach(btn=>{
    btn.classList.toggle('active',Number(btn.dataset.speed)===speed);
  });
  showMsg(`⏩ Швидкість ×${speed}`);
}

function restartGame(){
  document.getElementById('overlay').classList.remove('show');
  newGame();
}
function showMsg(s){
  const el=document.getElementById('message');
  el.textContent=s;el.classList.add('show');
  clearTimeout(showMsg.t);
  showMsg.t=setTimeout(()=>el.classList.remove('show'),1700);
}
function showWave(s){
  const el=document.getElementById('waveBanner');
  el.textContent=s;el.classList.add('show');
  clearTimeout(showWave.t);
  showWave.t=setTimeout(()=>el.classList.remove('show'),1000);
}
function addText(x,y,text,color='#fff',size=13){
  texts.push({x,y,text,color,size,life:1});
}
function burst(x,y,color,n=10,spd=90,gravity=180){
  for(let i=0;i<n;i++){
    particles.push({
      x,y,vx:rand(-spd,spd),vy:rand(-spd,15),
      life:rand(.35,.95),max:1,size:rand(2,5),color,gravity,rot:rand(0,TAU),vr:rand(-5,5)
    });
  }
}


function chooseWaveEvent(){
  game.eliteWave=(game.wave%7===0);
  game.goldWave=(game.wave%10===0);

  if(game.goldWave){game.event='gold';return;}
  if(game.eliteWave){game.event='elite';return;}

  const r=Math.random();
  if(r<.13)game.event='night';
  else if(r<.23)game.event='fog';
  else if(r<.32)game.event='storm';
  else if(r<.39&&currentSeason().id==='winter')game.event='blizzard';
  else game.event='normal';
}

function eventName(){
  return {
    normal:'Звичайна хвиля',
    night:'🌙 Ніч',
    fog:'🌫️ Туман',
    storm:'⛈️ Гроза',
    blizzard:'🌨️ Снігова буря',
    elite:'🔴 Елітна хвиля',
    gold:'🪙 Золота хвиля'
  }[game.event]||'Звичайна хвиля';
}


function addPerk(key,icon,name,desc){
  if(!game.perks[key]){
    game.perks[key]={icon,name,desc,count:0};
  }
  game.perks[key].count++;
  updatePerkHUD();
}

function updatePerkHUD(){
  const root=document.getElementById('perkBar');
  if(!root||!game)return;
  root.innerHTML='';

  for(const p of Object.values(game.perks)){
    const el=document.createElement('div');
    el.className='perkIcon';
    el.dataset.tip=`${p.name}: ${p.desc}${p.count>1?` • x${p.count}`:''}`;
    el.title=`${p.name}: ${p.desc}`;
    el.innerHTML=`<span>${p.icon}</span>${p.count>1?`<span class="perkCount">×${p.count}</span>`:''}`;
    root.appendChild(el);
  }
}

function showBossReward(){
  const pool=[
    {
      key:'walls',icon:'🧱',name:'Міцні мури',
      desc:'+12% максимального HP воріт.',
      apply:()=>{const gain=Math.round(game.gateMax*.12);game.gateMax+=gain;game.gateHp+=gain}
    },
    {
      key:'damage',icon:'⚔️',name:'Бойова школа',
      desc:'+10% до шкоди всіх захисників.',
      apply:()=>game.damageBonus+=.10
    },
    {
      key:'gold',icon:'💰',name:'Скарбник',
      desc:'+12% золота з кожного вбитого ворога.',
      apply:()=>game.goldBonus+=.12
    },
    {
      key:'crit',icon:'🎯',name:'Орлине око',
      desc:'+5% шанс критичного пострілу лучників.',
      apply:()=>game.critChance=Math.min(.55,game.critChance+.05)
    },
    {
      key:'towers',icon:'🗼',name:'Сталеві вежі',
      desc:'+18% максимального HP башт.',
      apply:()=>{const gain=Math.round(game.towerMax*.18);game.towerMax+=gain;game.towerHp+=gain}
    },
    {
      key:'speed',icon:'⚡',name:'Швидкі руки',
      desc:'Лучники стріляють приблизно на 8% швидше.',
      apply:()=>game.techLevel+=1
    },
    {
      key:'income',icon:'👑',name:'Королівська казна',
      desc:'+8 золота після кожної завершеної хвилі.',
      apply:()=>game.waveGoldBonus+=8
    },
    {
      key:'traps',icon:'🪤',name:'Майстер пасток',
      desc:'+1 рівень дорожніх пасток.',
      apply:()=>game.traps=Math.min(4,game.traps+1)
    }
  ];

  const picks=[];
  const used=new Set();
  while(picks.length<3){
    const idx=Math.floor(Math.random()*pool.length);
    if(!used.has(idx)){used.add(idx);picks.push(pool[idx]);}
  }

  const root=document.getElementById('rewardChoices');
  root.innerHTML='';

  picks.forEach((p)=>{
    const b=document.createElement('button');
    b.className='rewardChoice';
    b.innerHTML=`<b>${p.icon} ${p.name}</b><span>${p.desc}</span>`;
    b.onclick=()=>{
      p.apply();
      addPerk(p.key,p.icon,p.name,p.desc);
      game.pausedForReward=false;
      document.getElementById('rewardOverlay').classList.remove('show');
      updateShop();
      syncHUD();
      showMsg(`🎁 ${p.name}`);
    };
    root.appendChild(b);
  });

  game.pausedForReward=true;
  document.getElementById('rewardOverlay').classList.add('show');
}

function enemyStats(type){
  const w=game.wave;
  const season=currentSeason();
  const cycle=seasonCycleNumber(w);

  const yearHp=1+cycle*.18;
  const yearDmg=1+cycle*.12;
  const yearSpd=1+cycle*.035;
  const elite=game.event==='elite'?1.42:1;
  const night=game.event==='night'?1.13:1;

  function mk(t,hp,spd,dmg,reward,scale=1){
    return {
      type:t,
      hp:hp*season.hpMul*yearHp*elite*night,
      speed:spd*season.speedMul*yearSpd,
      damage:dmg*season.damageMul*yearDmg*(game.event==='elite'?1.18:1)*(game.event==='night'?1.10:1),
      reward:reward*(game.goldWave?2.5:1),
      scale
    };
  }

  if(type==='builder') return mk('builder',155+w*13.5,69+w*.75,8+w*.38,34,1.03);
  if(type==='archer') return mk('archer',82+w*8.8,42+w*.72,8.5+w*.52,22,.98);
  if(type==='ram') return mk('ram',260+w*22,22+w*.35,34+w*1.65,42,1.35);
  if(type==='catapult') return mk('catapult',210+w*18,20+w*.30,18+w*.95,44,1.25);
  if(type==='flyer') return mk('flyer',72+w*7.5,66+w*1.2,11+w*.55,23,.92);
  if(type==='necromancer') return mk('necromancer',115+w*11,30+w*.5,10+w*.45,38,1.05);
  if(type==='healer') return mk('healer',102+w*10,31+w*.55,8+w*.4,34,1.02);
  if(type==='bomber') return mk('bomber',92+w*8,50+w*.9,58+w*2.1,30,1.02);
  if(type==='armored') return mk('armored',180+w*17,29+w*.5,14+w*.75,31,1.16);
  if(type==='poison') return mk('poison',90+w*9,46+w*.8,9+w*.45,27,.98);
  if(type==='undead') return mk('undead',52+w*5.5,35+w*.55,7+w*.35,4,.92);
  if(type==='miniboss') return mk('miniboss',360+w*34,26+w*.4,24+w*1.15,70,1.42);

  if(type==='dragon'){
    return mk('dragon',1120+w*185,38+w*.35,31+w*1.6,260,2.0);
  }

  if(type==='boss'){
    return mk('boss',760+w*145,19+w*.52,25+w*1.9,155+w*11,1.75);
  }

  const r=Math.random();
  if(w>=18 && r<.08) return enemyStats('necromancer');
  if(w>=16 && r<.16) return enemyStats('catapult');
  if(w>=15 && r<.23) return enemyStats('healer');
  if(w>=14 && r<.31) return enemyStats('flyer');
  if(w>=13 && r<.39) return enemyStats('ram');
  if(w>=12 && r<.47) return enemyStats('bomber');
  if(w>=11 && r<.55) return enemyStats('poison');
  if(w>=9 && r<.64) return enemyStats('armored');
  if(w>=8 && r<.72) return enemyStats('archer');
  if(w>=6 && r<.80) return mk('shaman',88+w*10,32+w*.76,11+w*.62,26,1.02);
  if(w>=5 && r<.88) return mk('runner',50+w*7.5,64+w*1.65,8+w*.52,15,.88);
  if(w>=3 && r<.95) return mk('brute',130+w*15,28+w*.72,15+w*.82,22,1.20);

  return mk('goblin',70+w*8.5,40+w*.90,10+w*.58,13,1);
}
function spawnEnemy(force){
  const requested=(force&&force!=='normal')?force:null;
  const s=enemyStats(requested);
  const e={
    ...s,
    x:spawnX()+rand(0,95),y:groundY()-7,
    hp:s.hp,maxHp:s.hp,
    attackTimer:rand(.3,.9),hurt:0,wet:0,burning:0,dead:false,
    phase:rand(0,TAU),attackAnim:0,death:0,stun:0,
    building:false,builderDone:false,
    ranged:false,rangedTimer:rand(.55,1.15),rangedAnim:0,
    specialTimer:rand(2.2,5.2),healPulse:0,poisoned:false,
    flying:s.type==='flyer'||s.type==='dragon',
    seasonIndex:seasonIndexForWave(game.wave)
  };
  enemies.push(e);
  if(e.type==='boss'||e.type==='dragon'){
    game.boss=e;
    game.shake=6;
    showMsg('👑 ВЕЛИКИЙ ГОБЛІН-ВОЄВОДА!');
  }
}

function nextWave(){
  const oldSeason=seasonIndexForWave(game.wave);

  game.wave++;
  game.spawned=0;
  game.builderSpawned=false;
  game.waveTotal=7+Math.ceil(game.wave*2.05);
  game.wavePause=0;
  game.spawnTimer=.55;

  // Slightly less free gold than V3, but still enough to keep upgrades flowing.
  const bonus=28+game.wave*4+game.waveGoldBonus;
  game.gold+=bonus;

  chooseWaveEvent();

  const newSeason=seasonIndexForWave(game.wave);
  const s=currentSeason();

  if(newSeason!==oldSeason){
    showWave(`${s.icon} ${s.name.toUpperCase()}`);
    showMsg(`${s.icon} Починається ${s.name.toLowerCase()} — новий клан гоблінів`);
  }else{
    showWave(`ХВИЛЯ ${game.wave}`);
    showMsg(`🪙 Бонус за хвилю +${bonus}`);
  }

  updateShop();
}
function damageEnemy(e,dmg,color='#fff',source='generic'){
  if(e.dead)return;

  if(e.type==='armored'&&source==='arrow')dmg*=.48;
  if(e.type==='ram'&&source==='arrow')dmg*=.72;

  dmg*=1+game.damageBonus;
  e.hp-=dmg;
  e.hurt=.10;
  addText(e.x,e.y-72*e.scale,Math.round(dmg),color,12+(e.type==='boss'?3:0));
  if(e.hp<=0){
    if(e.type==='builder'&&e.building&&!game.bridge.active){
      game.bridge.building=false;
      game.bridge.buildProgress=0;
      showMsg('🛠️ Будівельника знищено — міст не добудований');
    }
    e.dead=true;
    e.death=.38;
    game.gold+=Math.round(e.reward*(1+game.goldBonus));
    game.kills++;
    if(!['undead','dragon'].includes(e.type))game.corpseSouls++;
    burst(e.x,e.y-28,'#809f43',14,e.type==='boss'?145:85);
    burst(e.x,e.y-24,'#5c3b27',8,70);
    if(e.type==='boss'||e.type==='dragon'){
      game.boss=null;
      game.gold+=e.type==='dragon'?240:120;
      game.flash=.18;
      game.shake=10;
      game.rewardPending=true;
      showMsg(e.type==='dragon'?'🐉 Дракона переможено!':'👑 Боса переможено!');
      setTimeout(()=>{ if(game.rewardPending&&!game.gameOver){game.rewardPending=false;showBossReward();} },250);
    }
    updateShop();
  }
}

function damageBridge(dmg){
  if(!game.bridge.active)return;
  game.bridge.hp-=dmg;
  const p=bridgePoint();
  addText(p.x,p.y-25,Math.round(dmg),'#ffd89a',12);
  burst(p.x,p.y-4,'#9b6b3e',5,42,115);

  if(game.bridge.hp<=0){
    game.bridge.hp=0;
    game.bridge.active=false;
    game.bridge.building=false;
    game.bridge.buildProgress=0;
    game.bridge.collapse=.75;
    game.shake=4;
    burst(p.x,p.y-2,'#755033',24,95,150);
    showMsg('🏹 Міст зруйновано — рів знову працює');
  }
}

function fireArrow(i){
  const slot=archerSlot(i);
  const ax=slot.x+18;
  const ay=slot.feetY-30;

  // Once the bridge is finished, every archer prioritizes destroying it.
  if(game.bridge.active){
    const p=bridgePoint();
    const speed=470+Math.min(game.archerLevel-1,5)*18;
    const dx=p.x-ax,dy=p.y-ay,len=Math.hypot(dx,dy)||1;
    arrows.push({
      x:ax,y:ay,vx:dx/len*speed,vy:dy/len*speed,
      rot:Math.atan2(dy,dx),life:2,
      target:null,targetType:'bridge',
      damage:(17+game.archerLevel*7)*.92,
      level:game.archerLevel,
      trail:[]
    });
    return;
  }

  let target=null,best=Infinity;
  for(const e of enemies){
    if(e.dead)continue;

    // Builders are strategically important and get a small targeting priority.
    const d=e.x-ax-(e.type==='builder'?55:0);
    if(d>0&&d<best){best=d;target=e;}
  }
  if(!target)return;

  const tx=target.x,ty=target.y-45*target.scale;
  const speed=470+Math.min(game.archerLevel-1,5)*18;
  const dx=tx-ax,dy=ty-ay,len=Math.hypot(dx,dy)||1;
  arrows.push({
    x:ax,y:ay,vx:dx/len*speed,vy:dy/len*speed,
    rot:Math.atan2(dy,dx),life:2,target,targetType:'enemy',
    damage:18+game.archerLevel*7,
    level:game.archerLevel,
    crit:Math.random()<game.critChance,
    trail:[]
  });
}
function spillLava(){
  game.lavaCooldown=Math.max(5.7,9.5-game.lavaLevel*.7);
  game.lavaPour=1.35;
  const lx=gateX()+60;
  for(const e of enemies){
    if(!e.dead&&e.x>lx-5&&e.x<lx+150){
      e.burning=3.8;
      damageEnemy(e,26+game.lavaLevel*10,'#ffbc55');
    }
  }
  for(let i=0;i<60;i++){
    particles.push({
      x:lx+rand(0,145),y:groundY()-rand(0,20),vx:rand(-30,95),vy:rand(-155,-35),
      life:rand(.45,1.2),max:1,size:rand(3,8),
      color:Math.random()<.45?'#ff5a2d':Math.random()<.75?'#ff9a35':'#ffd05b',
      gravity:210,rot:0,vr:0
    });
  }
  game.shake=6;
}
function castMage(){
  const alive=enemies.filter(e=>!e.dead);
  if(!alive.length)return;
  const center=alive[Math.floor(Math.random()*Math.min(alive.length,5))];
  clouds.push({x:center.x,y:Math.max(80,center.y-165),life:5.0,strike:.15,phase:rand(0,TAU)});
  game.mageCooldown=Math.max(4.8,8.8-game.mageLevel*.65);
  showMsg('⚡ Маг викликає бурю');
}

function shootEnemyArrow(e){
  const startX=e.x-15;
  const startY=e.y-48*e.scale;
  const tx=gateX()+10;
  const ty=groundY()-105;
  const speed=285+game.wave*2.2;
  const dx=tx-startX,dy=ty-startY,len=Math.hypot(dx,dy)||1;

  enemyArrows.push({
    x:startX,y:startY,
    vx:dx/len*speed,vy:dy/len*speed,
    rot:Math.atan2(dy,dx),
    damage:e.damage,
    life:3.2,
    trail:[]
  });
}

 // ---------------- UPDATE ----------------
function update(dt){
  if(game.gameOver||game.pausedForReward)return;
  time+=dt;

  game.shake=Math.max(0,game.shake-dt*16);
  game.flash=Math.max(0,game.flash-dt*3.5);
  game.bridge.collapse=Math.max(0,game.bridge.collapse-dt);
  game.lavaPour=Math.max(0,game.lavaPour-dt);
  game.oilPour=Math.max(0,(game.oilPour||0)-dt);
  game.archerSlow=Math.max(0,game.archerSlow-dt);
  game.knightCooldown=Math.max(0,game.knightCooldown-dt);
  game.ballistaKick=Math.max(0,game.ballistaKick-dt*3.6);
  game.catapultKick=Math.max(0,game.catapultKick-dt*2.5);

  if(game.towerHp<=0&&!game.towerDestroyedNotified){
    game.towerHp=0;
    game.towerDestroyedNotified=true;
    showMsg('💥 Башти зруйновано — відбудуй їх, щоб повернути всіх куплених захисників');
  }

  // ambient
  for(const b of birds){
    b.x+=b.speed*dt;
    b.y+=Math.sin(time*1.3+b.phase)*1.2*dt;
    if(b.x>W+30){b.x=-30;b.y=rand(65,H*.32)}
  }

  // waves
  const alive=enemies.some(e=>!e.dead);
  if(game.spawned<game.waveTotal){
    game.spawnTimer-=dt;
    if(game.spawnTimer<=0){
      const seasonBoss=(game.wave%4===0&&game.spawned===game.waveTotal-1);
      const dragonBoss=(game.wave%16===0&&game.spawned===game.waveTotal-1);
      const miniBoss=(!seasonBoss&&game.wave>=6&&game.wave%2===0&&game.spawned===game.waveTotal-1);

      let force=dragonBoss?'dragon':seasonBoss?'boss':miniBoss?'miniboss':'normal';
      const builderMoment=Math.max(2,Math.floor(game.waveTotal*.24));
      if(
        !seasonBoss && !dragonBoss &&
        game.wave>=12 &&
        game.river &&
        !game.bridge.active &&
        !game.bridge.building &&
        !game.builderSpawned &&
        game.spawned>=builderMoment
      ){
        force='builder';
        game.builderSpawned=true;
        showMsg('🛠️ Гоблін-будівельник біжить до рову!');
      }

      spawnEnemy(force);
      game.spawned++;
      game.spawnTimer=Math.max(.34,1.08-game.wave*.024)+rand(0,.30);
    }
  }else if(!alive){
    if(game.wavePause<=0)game.wavePause=3.4;
    game.wavePause-=dt;
    if(game.wavePause<=0)nextWave();
  }

  // archers
  for(let i=0;i<(game.towerHp>0?game.archers:0);i++){
    archerTimers[i]-=dt*(game.archerSlow>0?.62:1);
    if(archerTimers[i]<=0){
      fireArrow(i);
      archerTimers[i]=Math.max(.32,(1.22-game.archerLevel*.09)*(1-Math.min(.32,game.techLevel*.08)))+i*.03;
    }
  }


  // defender ballista
  if(game.ballista&&game.towerHp>0){
    game.ballistaTimer-=dt;
    if(game.ballistaTimer<=0){
      fireBallista();
      game.ballistaTimer=Math.max(1.15,2.9-game.ballista*.25);
    }
  }

  // defender catapult
  if(game.catapult&&game.towerHp>0){
    game.catapultTimer-=dt;
    if(game.catapultTimer<=0){
      fireDefenderCatapult();
      game.catapultTimer=Math.max(2.2,5.0-game.catapult*.36);
    }
  }

  // boiling oil: cheaper, shorter-range secondary gate trap
  if(game.oil){
    game.oilCooldown-=dt;
    const oilZone=gateX()+95;
    if(game.oilCooldown<=0&&enemies.some(e=>!e.dead&&!e.flying&&e.x<oilZone)){
      game.oilCooldown=Math.max(5.4,8.4-game.oil*.55);
      game.oilPour=1.05;
      for(const e of enemies){
        if(!e.dead&&!e.flying&&e.x<oilZone&&e.x>gateX()-5){
          damageEnemy(e,18+game.oil*8,'#ffc776','oil');
          e.burning=Math.max(e.burning,1.7);
        }
      }
    }
  }

  // road traps
  if(game.traps){
    game.trapCooldown-=dt;
    if(game.trapCooldown<=0){
      const rb=riverBounds();
      const trapX=game.river?rb.right+95:gateX()+220;
      const target=enemies.find(e=>!e.dead&&!e.flying&&Math.abs(e.x-trapX)<45);
      if(target){
        if(game.traps>=1)damageEnemy(target,14+game.traps*5,'#ded7c8','trap');
        if(game.traps>=2){
          damageEnemy(target,24+game.traps*6,'#ffcc77','trap');
          burst(trapX,groundY()-8,'#8e7d67',12,75,150);
        }
        if(game.traps>=3){
          target.burning=Math.max(target.burning,2.2);
        }
        game.trapCooldown=Math.max(1.3,3.4-game.traps*.42);
      }
    }
  }

  // knights — actual melee units with HP, attack animations and deaths
  for(const k of knights){
    if(k.dead){
      k.death-=dt;
      continue;
    }

    k.phase+=dt*4.2;
    k.attackTimer-=dt;
    k.attackAnim=Math.max(0,k.attackAnim-dt*3.8);
    k.hurt=Math.max(0,k.hurt-dt*4.2);
    k.blockAnim=Math.max(0,k.blockAnim-dt*4);

    let target=null,best=Infinity;
    for(const e of enemies){
      if(e.dead||e.flying||e.type==='catapult')continue;
      const d=Math.abs(e.x-k.x);
      if(d<best){best=d;target=e}
    }

    if(target&&best<42){
      k.facing=target.x>=k.x?1:-1;
      if(k.attackTimer<=0){
        k.attackAnim=1;
        damageEnemy(target,k.damage,'#fff0b0','knight');
        burst(target.x,target.y-28,'#dad1c2',3,28,80);
        k.attackTimer=.78;
      }
    }else{
      k.facing=1;
      k.x+=38*dt;
      const maxX=W*.77;
      if(k.x>maxX)k.x=maxX;
    }
  }

  for(let i=knights.length-1;i>=0;i--){
    if(knights[i].dead&&knights[i].death<=0)knights.splice(i,1);
  }

  // river
  if(game.river){
    const maxAlligators=Math.min(4,1+Math.floor(game.riverLevel/2));
    while(alligators.length<maxAlligators){
      alligators.push({x:W*.59+rand(-60,60),y:groundY()+10,phase:rand(0,TAU),bite:rand(.2,1),biteAnim:0,facing:1});
    }
    for(const a of alligators){
      a.phase+=dt*1.8;
      a.bite-=dt;
      a.biteAnim=Math.max(0,a.biteAnim-dt*3.25);
      a.x+=Math.sin(a.phase)*7*dt;
      if(a.bite<=0&&!game.bridge.active){
        let near=null,best=999;
        for(const e of enemies){
          if(e.dead)continue;
          const d=Math.abs(e.x-a.x);
          if(d<55&&d<best){best=d;near=e}
        }
        if(near){
          a.facing=near.x>=a.x?1:-1;
          a.biteAnim=1;
          damageEnemy(near,14+game.riverLevel*5.5,'#d3f77f');
          near.wet=1.0;
          a.bite=Math.max(.82,1.55-game.riverLevel*.08);
          burst(near.x,groundY()+3,'#79d6ed',11,68,120);
        }
      }
    }
  }

  // lava
  if(game.lava){
    game.lavaCooldown-=dt;
    if(game.lavaCooldown<=0&&enemies.some(e=>!e.dead&&e.x<gateX()+150))spillLava();
  }

  // mage
  if(game.mage&&game.towerHp>0){
    game.mageCooldown-=dt;
    if(game.mageCooldown<=0)castMage();
  }

  for(const c of clouds){
    c.life-=dt;c.strike-=dt;c.phase+=dt;
    c.x+=Math.sin(c.phase*2)*4*dt;
    if(c.strike<=0){
      const near=enemies.filter(e=>!e.dead&&Math.abs(e.x-c.x)<140);
      if(near.length){
        const e=near[Math.floor(Math.random()*near.length)];
        lightnings.push({x1:c.x,y1:c.y+18,x2:e.x,y2:e.y-40*e.scale,life:.13});
        damageEnemy(e,26+game.mageLevel*11,'#e7f0ff');
        burst(e.x,e.y-35,'#e9f4ff',9,105,80);
        game.flash=.10;
      }
      c.strike=rand(.38,.72);
    }
  }
  for(let i=clouds.length-1;i>=0;i--)if(clouds[i].life<=0)clouds.splice(i,1);

  // arrows
  for(const a of arrows){
    a.life-=dt;
    a.trail.push({x:a.x,y:a.y,life:.12});
    if(a.trail.length>5)a.trail.shift();
    a.x+=a.vx*dt;a.y+=a.vy*dt;
    a.rot=Math.atan2(a.vy,a.vx);
    if(a.targetType==='bridge'){
      if(!game.bridge.active){
        a.life=0;
      }else{
        const p=bridgePoint();
        if(Math.hypot(a.x-p.x,a.y-p.y)<28){
          damageBridge(a.damage);
          a.life=0;
        }
      }
    }else{
      const e=a.target;
      if(e&&!e.dead&&Math.hypot(a.x-e.x,a.y-(e.y-42*e.scale))<28*e.scale){
        damageEnemy(e,a.damage*(a.crit?game.critDamage:1),a.crit?'#fff06a':'#ffe6a2','arrow');
        burst(a.x,a.y,'#e6d1a7',5,45,90);
        a.life=0;
      }
    }
  }
  for(let i=arrows.length-1;i>=0;i--)if(arrows[i].life<=0)arrows.splice(i,1);

  // enemy arrows fired from goblin archers
  for(const a of enemyArrows){
    a.life-=dt;
    a.trail.push({x:a.x,y:a.y,life:.11});
    if(a.trail.length>5)a.trail.shift();

    a.x+=a.vx*dt;
    a.y+=a.vy*dt;
    a.rot=Math.atan2(a.vy,a.vx);

    const targetX=gateX()+10;
    const targetY=groundY()-105;
    if(Math.hypot(a.x-targetX,a.y-targetY)<34){
      game.gateHp-=a.damage;
      addText(targetX,targetY-8,`-${Math.round(a.damage)}`,'#ff7777',12);
      burst(targetX,targetY,'#b9ad9c',5,48,120);
      game.shake=Math.max(game.shake,2.3);
      a.life=0;

      if(game.gateHp<=0){
        game.gateHp=0;
        endGame();
      }
    }
  }
  for(let i=enemyArrows.length-1;i>=0;i--)if(enemyArrows[i].life<=0)enemyArrows.splice(i,1);


  // stone projectiles: defender and enemy catapults
  for(const s of stones){
    s.t+=dt/s.duration;
    const q=clamp(s.t,0,1);
    const x=lerp(s.x,s.tx,q);
    const baseY=lerp(s.y,s.ty,q);
    const arc=-Math.sin(q*Math.PI)*130;
    s.cx=x;s.cy=baseY+arc;

    if(s.t>=1&&!s.hit){
      s.hit=true;

      if(s.side==='player'){
        for(const e of enemies){
          if(!e.dead&&Math.hypot(e.x-s.tx,(e.y-15)-s.ty)<s.radius){
            damageEnemy(e,s.damage,'#ffd398','catapult');
          }
        }
        burst(s.tx,s.ty,'#7c705e',18,95,170);
      }else{
        if(s.targetTower){
          game.towerHp-=s.damage;
          addText(s.tx,s.ty-15,`-${Math.round(s.damage)}`,'#ff7777',13);
        }else{
          game.gateHp-=s.damage;
          addText(s.tx,s.ty-15,`-${Math.round(s.damage)}`,'#ff7777',13);
        }
        burst(s.tx,s.ty,'#8f8170',18,100,180);
        game.shake=6;
        if(game.gateHp<=0){game.gateHp=0;endGame();}
        if(game.towerHp<0)game.towerHp=0;
      }
    }
  }
  for(let i=stones.length-1;i>=0;i--)if(stones[i].t>=1.06)stones.splice(i,1);

  // enemies
  const gate=gateX()+42;
  for(const e of enemies){
    if(e.dead)continue;
    e.phase+=dt*(e.speed*.12);
    e.hurt=Math.max(0,e.hurt-dt);
    e.wet=Math.max(0,e.wet-dt);
    e.attackAnim=Math.max(0,e.attackAnim-dt*3.2);
    e.rangedAnim=Math.max(0,e.rangedAnim-dt*4.5);

    if(e.burning>0){
      e.burning-=dt;
      if(Math.random()<dt*8){
        particles.push({
          x:e.x+rand(-14,14)*e.scale,y:e.y-rand(22,55)*e.scale,
          vx:rand(-12,12),vy:rand(-50,-18),
          life:rand(.3,.65),max:1,size:rand(2,5),
          color:Math.random()<.5?'#ff6a2d':'#ffc24b',gravity:-8,rot:0,vr:0
        });
      }
      damageEnemy(e,dt*(8+game.lavaLevel*3),'#ffac4c');
    }

    // support / special enemy abilities
    e.specialTimer-=dt;

    if(e.type==='healer'&&e.specialTimer<=0){
      for(const ally of enemies){
        if(!ally.dead&&ally!==e&&Math.abs(ally.x-e.x)<115){
          ally.hp=Math.min(ally.maxHp,ally.hp+ally.maxHp*.14);
          addText(ally.x,ally.y-65*ally.scale,'+HP','#8df58d',11);
        }
      }
      e.healPulse=.7;
      e.specialTimer=4.7;
    }
    e.healPulse=Math.max(0,(e.healPulse||0)-dt);

    if(e.type==='necromancer'&&e.specialTimer<=0&&game.corpseSouls>0){
      game.corpseSouls--;
      const u=enemyStats('undead');
      enemies.push({
        ...u,x:e.x+45,y:groundY()-7,hp:u.hp,maxHp:u.hp,
        attackTimer:.8,hurt:0,wet:0,burning:0,dead:false,
        phase:rand(0,TAU),attackAnim:0,death:0,stun:0,
        building:false,builderDone:false,ranged:false,rangedTimer:1,rangedAnim:0,
        specialTimer:4,flying:false,seasonIndex:e.seasonIndex
      });
      addText(e.x,e.y-76,'☠','#caa2ff',17);
      e.specialTimer=6.0;
    }

    if(e.type==='catapult'){
      const stopX=game.river?riverBounds().right+120:gate+330;
      if(e.x>stopX){e.x-=e.speed*dt;continue;}
      if(e.specialTimer<=0){
        fireEnemyCatapult(e);
        e.attackAnim=1;
        e.specialTimer=Math.max(2.8,5.2-game.wave*.018);
      }
      continue;
    }

    if(e.type==='dragon'){
      e.y=groundY()-165+Math.sin(time*2+e.phase)*18;
      const stopX=gate+330;
      if(e.x>stopX){e.x-=e.speed*dt;continue;}
      if(e.specialTimer<=0){
        // dragon breath damages both towers and gate
        const dmg=e.damage;
        e.attackAnim=1;
        game.towerHp-=dmg*.75;
        game.gateHp-=dmg*.55;
        game.flash=.12;
        game.shake=7;
        for(let fi=0;fi<25;fi++){
          particles.push({
            x:e.x-158,y:e.y-44,vx:rand(-220,-95),vy:rand(-55,55),
            life:rand(.35,.8),max:1,size:rand(3,7),
            color:Math.random()<.5?'#ff6b2d':'#ffd24d',gravity:-5,rot:0,vr:0
          });
        }
        e.specialTimer=2.6;
      }
      continue;
    }

    let speed=e.speed;
    if(e.wet>0)speed*=.68;

    const rb=riverBounds();

    if(e.type==='flyer'){
      e.y=groundY()-105+Math.sin(time*4+e.phase)*13;
      const stopX=castleX()+185;
      if(e.x>stopX){e.x-=speed*dt;continue;}
      e.attackTimer-=dt;
      if(e.attackTimer<=0){
        if(game.towerHp>0){
          game.towerHp-=e.damage;
          addText(castleX(),groundY()-300,`-${Math.round(e.damage)}`,'#ff7777',12);
        }else{
          game.gateHp-=e.damage;
        }
        e.attackTimer=1.45;
      }
      continue;
    }

    // Ground goblins engage our knights instead of phasing through them.
    if(!['archer','catapult','flyer','dragon','healer','necromancer'].includes(e.type)){
      let defender=null;
      let defenderDist=Infinity;

      for(const k of knights){
        if(k.dead)continue;
        const d=Math.abs(e.x-k.x);
        if(d<defenderDist){defenderDist=d;defender=k}
      }

      if(defender&&defenderDist<38){
        e.attackTimer-=dt;

        if(e.attackTimer<=0){
          e.attackAnim=1;

          let knightDamage=e.damage;
          if(e.type==='ram')knightDamage*=1.35;
          if(e.type==='brute'||e.type==='miniboss'||e.type==='boss')knightDamage*=1.12;

          // Shield absorbs some of the incoming hit, but knights are fully killable.
          const shieldReduction=.20;
          const dealt=knightDamage*(1-shieldReduction);
          defender.hp-=dealt;
          defender.hurt=1;
          defender.blockAnim=1;

          addText(defender.x,defender.y-62,`-${Math.round(dealt)}`,'#ff8b7d',11);
          burst(defender.x,defender.y-30,'#c8b8a0',4,38,100);

          if(e.type==='bomber'){
            defender.hp-=e.damage*.55;
            e.dead=true;
            e.death=.22;
            burst(e.x,e.y-25,'#ff7038',20,125,175);
          }

          if(defender.hp<=0&&!defender.dead){
            defender.hp=0;
            defender.dead=true;
            defender.death=.55;
            burst(defender.x,defender.y-30,'#9b3940',13,75,150);
            addText(defender.x,defender.y-70,'Лицар загинув','#ffb0a8',11);
          }

          e.attackTimer=e.type==='boss'?1.0:e.type==='brute'?1.25:1.45;
        }

        continue;
      }
    }

    // Special engineer AI: from wave 12 it runs to the moat and builds a bridge.
    if(e.type==='builder'&&game.river&&!game.bridge.active&&!e.builderDone){
      const buildX=rb.right+24;

      if(e.x>buildX){
        e.x-=speed*dt;
        continue;
      }

      e.building=true;
      game.bridge.building=true;
      e.attackAnim=.75+.25*Math.sin(time*11);
      game.bridge.buildProgress=Math.min(1,game.bridge.buildProgress+dt/4.0);

      if(game.bridge.buildProgress>=1){
        const bridgeHp=480+game.wave*34;
        game.bridge.active=true;
        game.bridge.building=false;
        game.bridge.hp=bridgeHp;
        game.bridge.maxHp=bridgeHp;
        game.bridge.buildProgress=1;
        e.building=false;
        e.builderDone=true;
        showMsg('🌉 Міст готовий — рів тимчасово вимкнений!');
      }else{
        continue;
      }
    }

    // A completed bridge bypasses the whole moat for the army.
    if(game.river&&!game.bridge.active&&e.x>rb.left-5&&e.x<rb.right+5){
      speed*=Math.max(.62,.88-game.riverLevel*.04);
    }

    // Goblin archer: once it has crossed the moat, it establishes a firing position
    // and attacks the castle from range instead of walking to the gate.
    if(e.type==='archer'){
      const firingX=game.river ? rb.left-46 : gate+225;

      if(e.x>firingX){
        e.x-=speed*dt;
        continue;
      }

      e.ranged=true;
      e.rangedTimer-=dt;
      if(e.rangedTimer<=0){
        e.rangedAnim=1;
        shootEnemyArrow(e);
        e.rangedTimer=Math.max(.78,1.72-game.wave*.012)+rand(0,.28);
      }
      continue;
    }

    if(e.x>gate+20){
      e.x-=speed*dt;
    }else{
      if(e.type==='bomber'){
        game.gateHp-=e.damage;
        game.shake=11;
        game.flash=.15;
        burst(gate,groundY()-35,'#ff7038',28,145,190);
        e.hp=0;e.dead=true;e.death=.2;
        if(game.gateHp<=0){game.gateHp=0;endGame();}
        continue;
      }

      e.attackTimer-=dt;
      if(e.attackTimer<=0){
        e.attackAnim=1;
        const hitDamage=e.type==='ram'?e.damage*1.8:e.damage;
        game.gateHp-=hitDamage;
        if(e.type==='poison')game.archerSlow=5;
        game.shake=(e.type==='boss'||e.type==='ram')?12:5;
        addText(gate,groundY()-104,`-${Math.round(hitDamage)}`,'#ff6f6f',14);
        burst(gate,groundY()-54,'#b8aa97',e.type==='boss'?16:7,95,160);
        e.attackTimer=e.type==='boss'?1.15:1.6;
        if(game.gateHp<=0){
          game.gateHp=0;
          endGame();
        }
      }
    }
  }

  // corpses / removal
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.dead){
      e.death-=dt;
      if(e.death<=0)enemies.splice(i,1);
    }
  }

  // particles/text
  for(const p of particles){
    p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.gravity*dt;p.rot+=p.vr*dt
  }
  for(let i=particles.length-1;i>=0;i--)if(particles[i].life<=0)particles.splice(i,1);

  for(const tx of texts){tx.life-=dt;tx.y-=32*dt}
  for(let i=texts.length-1;i>=0;i--)if(texts[i].life<=0)texts.splice(i,1);

  for(const l of lightnings)l.life-=dt;
  for(let i=lightnings.length-1;i>=0;i--)if(lightnings[i].life<=0)lightnings.splice(i,1);


  syncHUD();
}

function endGame(){
  game.gameOver=true;
  document.getElementById('resultText').textContent=`Ти дійшов до хвилі ${game.wave}, знищив ${game.kills} ворогів і пережив ${Math.floor((game.wave-1)/4)} сезонів.`;
  document.getElementById('overlay').classList.add('show');
}

function deployKnights(){
  if(game.knightCooldown>0){
    showMsg(`⚔️ Загін буде готовий через ${Math.ceil(game.knightCooldown)}с`);
    return;
  }

  const cost=90+game.knightLevel*45;
  if(!spend(cost))return;
  if(game.knightLevel===0)game.knightLevel=1;

  const count=2+Math.min(3,game.knightLevel);
  for(let i=0;i<count;i++){
    const hp=135+game.knightLevel*52+game.castleLevel*12;
    knights.push({
      x:gateX()+38-i*15,
      y:groundY()-5,
      hp,maxHp:hp,
      damage:24+game.knightLevel*11,
      attackTimer:.18+i*.12,
      attackAnim:0,
      hurt:0,
      death:0,
      blockAnim:0,
      phase:i*1.4,
      facing:1,
      dead:false
    });
  }

  game.knightCooldown=Math.max(11,21-game.knightLevel*2);
  showMsg('⚔️ Лицарі вийшли з воріт');
  updateShop();
}
function repairTowers(){
  if(game.towerHp>=game.towerMax){
    showMsg('Башти цілі');
    return;
  }

  if(game.towerHp<=0){
    const rebuildCost=300+game.castleLevel*95;
    if(!spend(rebuildCost))return;

    game.towerHp=Math.round(game.towerMax*.75);
    game.towerDestroyedNotified=false;
    archerTimers=[0,0,0];
    game.mageCooldown=.6;
    game.ballistaTimer=.5;
    game.catapultTimer=.8;

    showMsg('🏗️ Башти відбудовано — лучники, маг, балліста й катапульта повернулися');
    updateShop();
    return;
  }

  const cost=Math.max(90,Math.round((game.towerMax-game.towerHp)*1.15));
  if(!spend(cost))return;
  game.towerHp=Math.min(game.towerMax,game.towerHp+game.towerMax*.55);
  showMsg('🧱 Башти відремонтовано');
  updateShop();
}
function upgradeCastle(){
  if(game.castleLevel>=7){
    showMsg('🏰 Фортеця вже максимального рівня');
    return;
  }

  const cost=castleCost();
  if(!spend(cost))return;

  game.castleLevel++;
  game.gateMax+=170;
  game.gateHp+=170;
  game.towerMax+=90;
  game.towerHp+=90;
  if(game.towerHp>0)game.towerDestroyedNotified=false;

  const names={
    2:'Кам’яний бастіон',
    3:'Укріплена цитадель',
    4:'Королівська фортеця',
    5:'Високий донжон',
    6:'Великий замковий комплекс',
    7:'Імперська цитадель'
  };
  showMsg(`🏰 ${names[game.castleLevel]}`);
  updateShop();
}
function buyTech(){
  const cost=280+game.techLevel*220;
  if(!spend(cost))return;
  game.techLevel++;
  game.critChance=Math.min(.42,game.critChance+.025);
  showMsg(`📜 Військові технології Lv.${game.techLevel}`);
  updateShop();
}

function fireBallista(){
  if(!game.ballista||game.towerHp<=0)return;
  game.ballistaKick=.38;
  const targets=enemies.filter(e=>!e.dead).sort((a,b)=>a.x-b.x);
  if(!targets.length)return;

  const target=targets[0];
  const sx=castleX()+91,sy=groundY()-292;
  const dx=target.x-sx,dy=(target.y-45*target.scale)-sy,len=Math.hypot(dx,dy)||1;
  arrows.push({
    x:sx,y:sy,vx:dx/len*610,vy:dy/len*610,rot:Math.atan2(dy,dx),
    life:2,target,targetType:'enemy',
    damage:72+game.ballista*38,level:5,crit:false,ballista:true,trail:[]
  });
}
function fireDefenderCatapult(){
  if(!game.catapult||game.towerHp<=0)return;
  game.catapultKick=.62;
  const alive=enemies.filter(e=>!e.dead);
  if(!alive.length)return;
  const target=alive[Math.floor(Math.random()*Math.min(5,alive.length))];

  stones.push({
    side:'player',x:castleX()-115,y:groundY()-330,
    tx:target.x,ty:target.y-12,
    t:0,duration:.88,
    damage:48+game.catapult*27,
    radius:78+game.catapult*7,
    size:15+game.catapult*2
  });
}
function fireEnemyCatapult(e){
  const targetTower=Math.random()<.65&&game.towerHp>0;
  stones.push({
    side:'enemy',x:e.x-25,y:e.y-75,
    tx:targetTower?castleX():gateX(),
    ty:targetTower?groundY()-255:groundY()-90,
    t:0,duration:1.05,
    damage:e.damage,
    radius:55,targetTower,
    size:13
  });
}

// ---------------- ECONOMY ----------------
function spend(cost){
  if(game.gold<cost){showMsg('🪙 Не вистачає золота');return false}
  game.gold-=cost;return true
}
function gateCost(){return 90+(game.gateLevel-1)*65}
function archerCost(){return [70,105,145][game.archers]??999}
function archerUpCost(){return 70+game.archerLevel*55}
function riverCost(){return game.river?100+game.riverLevel*75:145}
function lavaCost(){return game.lava?125+game.lavaLevel*85:185}
function mageCost(){return game.mage?160+game.mageLevel*105:240}
function repairCost(){return Math.max(120,Math.round((game.gateMax-game.gateHp)*1.45))}
function castleCost(){return 360+(game.castleLevel-1)*300}

function buyGate(){
  const c=gateCost();if(!spend(c))return;
  game.gateLevel++;
  const old=game.gateMax;
  game.gateMax=300+(game.gateLevel-1)*135;
  game.gateHp+=game.gateMax-old;
  showMsg(`🏰 Ворота Lv.${game.gateLevel}`);
  updateShop()
}
function buyArcher(){
  if(game.archers>=3)return;
  const c=archerCost();if(!spend(c))return;
  game.archers++;
  showMsg(`🏹 Лучник ${game.archers}/3`);
  updateShop()
}
function upgradeArchers(){
  if(game.archers===0){showMsg('Спочатку найми лучника');return}
  const c=archerUpCost();if(!spend(c))return;
  game.archerLevel++;
  showMsg(`🎯 Лучники Lv.${game.archerLevel}`);
  updateShop()
}
function buyRiver(){
  const c=riverCost();if(!spend(c))return;
  const first=!game.river;
  game.river=true;game.riverLevel++;
  if(first){
    game.bridge.active=false;
    game.bridge.building=false;
    game.bridge.buildProgress=0;
  }
  showMsg(game.riverLevel===1?'🐊 Рів з алігаторами готовий':`🐊 Рів Lv.${game.riverLevel}`);
  updateShop()
}
function buyLava(){
  const c=lavaCost();if(!spend(c))return;
  game.lava=true;game.lavaLevel++;game.lavaCooldown=.9;
  showMsg(game.lavaLevel===1?'🌋 Лавова пастка встановлена':`🌋 Лава Lv.${game.lavaLevel}`);
  updateShop()
}
function buyMage(){
  const c=mageCost();if(!spend(c))return;
  game.mage=true;game.mageLevel++;game.mageCooldown=1;
  showMsg(game.mageLevel===1?'🧙 Маг прибув':`🧙 Маг Lv.${game.mageLevel}`);

}
function repairGate(){
  if(game.gateHp>=game.gateMax){showMsg('Ворота цілі');return}
  const c=repairCost();if(!spend(c))return;
  game.gateHp=Math.min(game.gateMax,game.gateHp+game.gateMax*.55);

}
function setBtn(id,name,desc,price,disabled=false){
  const b=document.getElementById(id);
  b.disabled=disabled;
  b.innerHTML=`<span class="name">${name}</span><span class="desc">${desc}</span><span class="price">${price}</span>`;
}

  setBtn(
    'mageBtn',

    game.towerHp<=0?'збережений • повернеться після відбудови':'грозова хмара',
    `🪙 ${mageCost()}`
  );
  setBtn('repairBtn','🔨 Ремонт','55% • дуже дорогий',`🪙 ${repairCost()}`);
  setBtn('ballistaBtn',game.ballista?`🎯 Балліста Lv.${game.ballista}`:'🎯 Балліста','пробивний постріл',`🪙 ${game.ballista?260+game.ballista*180:330}`);
  setBtn('catapultBtn',game.catapult?`🪨 Катапульта Lv.${game.catapult}`:'🪨 Катапульта','удар по площі',`🪙 ${game.catapult?310+game.catapult*220:420}`);
  setBtn('oilBtn',game.oil?`🛢️ Олія Lv.${game.oil}`:'🛢️ Кипляча олія','дешева пастка воріт',`🪙 ${game.oil?155+game.oil*110:210}`);
  setBtn('trapsBtn',`🪤 Пастки Lv.${game.traps}`,'шипи → міни → вогонь',game.traps>=4?'MAX':`🪙 ${150+game.traps*130}`,game.traps>=4);
  setBtn('knightsBtn',game.knightLevel?`⚔️ Лицарі Lv.${game.knightLevel}`:'⚔️ Лицарі',game.knightCooldown>0?`готові через ${Math.ceil(game.knightCooldown)}с`:'випустити загін',`🪙 ${90+game.knightLevel*45}`);
  const towersDestroyed=game.towerHp<=0;
  const towerRepairCost=towersDestroyed
    ?300+game.castleLevel*95
    :Math.max(90,Math.round((game.towerMax-game.towerHp)*1.15));
  setBtn(
    'towerRepairBtn',
    towersDestroyed?'🏗️ Відбудувати башти':'🧱 Ремонт башт',
    towersDestroyed?'повернути всіх захисників':'відновити 55%',
    `🪙 ${towerRepairCost}`
  );
  setBtn(
    'castleBtn',
    `🏰 Фортеця Lv.${game.castleLevel}`,
    game.castleLevel>=7?'імперська цитадель MAX':'нова секція + більше HP',
    game.castleLevel>=7?'MAX':`🪙 ${castleCost()}`,
    game.castleLevel>=7
  );
  setBtn('techBtn',`📜 Технології Lv.${game.techLevel}`,'швидкість + крит',`🪙 ${280+game.techLevel*220}`);
  syncHUD()
}
function syncHUD(){
  document.getElementById('hp').textContent=`${Math.ceil(game.gateHp)}/${game.gateMax}`;
  document.getElementById('wave').textContent=game.wave;
  const season=currentSeason();
  document.getElementById('seasonLabel').textContent=`${season.icon} ${season.name}`;
  document.getElementById('towerHp').textContent=`${Math.max(0,Math.ceil(game.towerHp))}/${game.towerMax}`;
  document.getElementById('eventLabel').textContent=eventName();
  document.getElementById('gold').textContent=Math.floor(game.gold);
  document.getElementById('kills').textContent=game.kills;
  updatePerkHUD();
  const bw=document.getElementById('bossWrap'),bf=document.getElementById('bossFill');
  if(game.boss&&!game.boss.dead){
    bw.style.display='block';
    bf.style.width=(100*game.boss.hp/game.boss.maxHp)+'%';
    const bs=SEASONS[game.boss.seasonIndex ?? seasonIndexForWave(game.wave)];
    document.getElementById('bossTitle').textContent=game.boss.type==='dragon'
      ?'🐉 ANCIENT FROST DRAGON'
      :`👑 ${bs.bossName.toUpperCase()}`;
  }else bw.style.display='none'
}

function drawSky(){
  const gy=groundY();
  const s=currentSeason();

  const sky=ctx.createLinearGradient(0,0,0,gy);
  sky.addColorStop(0,s.skyTop);
  sky.addColorStop(.34,s.skyMid);
  sky.addColorStop(.70,s.skyLow);
  sky.addColorStop(1,s.skyBottom);
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,gy);

  const glow=ctx.createRadialGradient(W*.70,H*.23,10,W*.70,H*.23,H*.48);
  if(s.id==='winter'){
    glow.addColorStop(0,'rgba(224,240,249,.20)');
    glow.addColorStop(1,'rgba(224,240,249,0)');
  }else{
    glow.addColorStop(0,'rgba(255,229,171,.30)');
    glow.addColorStop(1,'rgba(255,225,172,0)');
  }
  ctx.fillStyle=glow;ctx.fillRect(0,0,W,gy);

  // stable cloud banks
  const cloudSets=[
    {x:.18,y:.16,z:1.05,a:.27},
    {x:.52,y:.11,z:.82,a:.17},
    {x:.82,y:.20,z:1.18,a:.24},
    {x:.39,y:.30,z:.67,a:.14}
  ];
  for(const c of cloudSets){
    const cx=W*c.x,cy=H*c.y,z=c.z;
    const cloudCol=s.id==='winter'?'225,233,239':'226,235,224';
    ctx.fillStyle=`rgba(${cloudCol},${c.a})`;
    ctx.beginPath();
    ctx.ellipse(cx,cy,76*z,24*z,0,0,TAU);
    ctx.ellipse(cx-52*z,cy+2*z,48*z,22*z,0,0,TAU);
    ctx.ellipse(cx+46*z,cy-15*z,56*z,32*z,0,0,TAU);
    ctx.ellipse(cx+94*z,cy+2*z,42*z,20*z,0,0,TAU);
    ctx.fill();
  }

  // far mountains
  ctx.fillStyle=s.hill;
  ctx.beginPath();ctx.moveTo(0,gy*.62);
  for(let x=0,idx=0;x<=W+120;x+=105,idx++){
    const peak=38+hash01(idx+11)*74;
    ctx.lineTo(x,gy*.62-peak);
  }
  ctx.lineTo(W,gy);ctx.lineTo(0,gy);ctx.fill();

  // mountain highlights / winter snowcaps
  ctx.fillStyle=s.id==='winter'?'rgba(239,245,244,.50)':'rgba(201,217,211,.18)';
  for(let x=0,idx=0;x<=W+120;x+=210,idx++){
    const peak=55+hash01(idx+77)*55;
    ctx.beginPath();
    ctx.moveTo(x,gy*.62-peak);
    ctx.lineTo(x+34,gy*.62-peak+30);
    ctx.lineTo(x+66,gy*.62-peak+15);
    ctx.closePath();ctx.fill();
  }

  // near hills
  const hillGrad=ctx.createLinearGradient(0,gy*.55,0,gy);
  hillGrad.addColorStop(0,s.hill);
  hillGrad.addColorStop(1,s.hill2);
  ctx.fillStyle=hillGrad;
  ctx.beginPath();ctx.moveTo(0,gy*.72);
  for(let x=0,idx=0;x<=W+160;x+=150,idx++){
    const lift=18+hash01(idx+133)*52;
    ctx.quadraticCurveTo(x+75,gy*.64-lift,x+150,gy*.72);
  }
  ctx.lineTo(W,gy);ctx.lineTo(0,gy);ctx.fill();

  // seasonal tree line
  for(let x=-12,idx=0;x<W+30;x+=30,idx++){
    const th=28+hash01(idx+251)*42;
    ctx.fillStyle=idx%2?s.treeA:s.treeB;
    ctx.beginPath();
    ctx.moveTo(x,gy-43);ctx.lineTo(x+15,gy-43-th);ctx.lineTo(x+30,gy-43);ctx.fill();

    if(s.id==='winter'){
      ctx.fillStyle='rgba(235,242,241,.42)';
      ctx.beginPath();
      ctx.moveTo(x+4,gy-46);ctx.lineTo(x+15,gy-43-th);ctx.lineTo(x+24,gy-46);ctx.fill();
    }
  }

  // ground
  const g=ctx.createLinearGradient(0,gy,0,H);
  g.addColorStop(0,s.ground1);
  g.addColorStop(1,s.ground2);
  ctx.fillStyle=g;ctx.fillRect(0,gy,W,H-gy);

  // winter snow layer
  if(s.id==='winter'){
    ctx.fillStyle='rgba(233,240,239,.55)';
    ctx.fillRect(0,gy,W,18);
  }

  // road
  const road=ctx.createLinearGradient(gateX()-30,0,W,0);
  if(s.id==='winter'){
    road.addColorStop(0,'#706a61');
    road.addColorStop(.5,'#9b958a');
    road.addColorStop(1,'#665f57');
  }else if(s.id==='autumn'){
    road.addColorStop(0,'#6d5540');
    road.addColorStop(.5,'#8f6c4b');
    road.addColorStop(1,'#5b4838');
  }else{
    road.addColorStop(0,'#755e45');
    road.addColorStop(.5,'#927b59');
    road.addColorStop(1,'#69553f');
  }
  ctx.fillStyle=road;
  ctx.beginPath();
  ctx.moveTo(gateX()-22,gy-8);
  ctx.lineTo(W,gy-19);
  ctx.lineTo(W,H);
  ctx.lineTo(gateX()-52,H);
  ctx.closePath();ctx.fill();

  // fixed road texture
  for(let i=0;i<110;i++){
    const px=hash01(i+400)*W;
    const py=gy+hash01(i+800)*Math.max(1,H-gy);
    const sw=2+hash01(i+1200)*5;
    const sh=1+hash01(i+1600)*2;
    ctx.fillStyle=i%3===0?'rgba(45,34,27,.19)':'rgba(218,195,142,.08)';
    ctx.fillRect(px,py,sw,sh);
  }

  // seasonal ground detail
  if(s.id==='autumn'){
    for(let i=0;i<34;i++){
      const px=hash01(i+5100)*W;
      const py=gy+hash01(i+5300)*Math.max(8,H-gy);
      ctx.fillStyle=i%2?'rgba(151,79,37,.60)':'rgba(194,119,48,.55)';
      ctx.save();ctx.translate(px,py);ctx.rotate(hash01(i+5500)*2);
      ctx.fillRect(-2,-1,5,3);ctx.restore();
    }
  }else if(s.id==='winter'){
    // smooth fixed snowfall positions drifting only vertically, not random teleporting
    for(let i=0;i<46;i++){
      const baseX=hash01(i+6100)*W;
      const speed=8+hash01(i+6300)*16;
      const py=((hash01(i+6500)*H + time*speed)%(H+30))-15;
      const px=baseX+Math.sin(time*.5+i)*5;
      ctx.fillStyle='rgba(245,250,250,.72)';
      ctx.beginPath();ctx.arc(px,py,1+hash01(i+6700)*1.4,0,TAU);ctx.fill();
    }
  }else{
    ctx.strokeStyle='#2d4029';ctx.lineWidth=1.3;
    for(let i=0;i<82;i++){
      const x=hash01(i+2100)*W;
      const y=gy+8+hash01(i+2600)*Math.max(10,H-gy-8);
      const h=5+hash01(i+3100)*5;
      ctx.beginPath();
      ctx.moveTo(x,y);ctx.lineTo(x-3,y-h);
      ctx.moveTo(x,y);ctx.lineTo(x+4,y-h*.8);ctx.stroke();
    }
  }

  // birds only outside winter
  if(s.id!=='winter'){
    ctx.strokeStyle='rgba(31,40,44,.50)';ctx.lineWidth=1.2;
    for(const b of birds){
      const flap=Math.sin(time*4+b.phase)*3;
      ctx.beginPath();
      ctx.moveTo(b.x-6,b.y);ctx.quadraticCurveTo(b.x-3,b.y-flap,b.x,b.y);
      ctx.quadraticCurveTo(b.x+3,b.y-flap,b.x+6,b.y);ctx.stroke();
    }
  }
}

// ---------------- DRAW: CASTLE ----------------
function stoneRect(x,y,w,h,base='#7d7e7e'){
  // The side-to-side gradient makes walls feel cylindrical / lit instead of flat.
  const grad=ctx.createLinearGradient(x,0,x+w,0);
  grad.addColorStop(0,'#555a5e');
  grad.addColorStop(.12,base);
  grad.addColorStop(.58,'#929698');
  grad.addColorStop(.87,base);
  grad.addColorStop(1,'#50555a');
  ctx.fillStyle=grad;ctx.fillRect(x,y,w,h);

  // top bevel
  ctx.fillStyle='rgba(255,255,255,.10)';ctx.fillRect(x+2,y+2,w-4,3);
  ctx.fillStyle='rgba(0,0,0,.16)';ctx.fillRect(x+w-7,y+4,7,h-4);

  // masonry
  ctx.strokeStyle='rgba(35,37,38,.36)';ctx.lineWidth=1;
  for(let yy=y+15;yy<y+h;yy+=18){
    ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+w,yy);ctx.stroke();
  }
  for(let row=0,yy=y;yy<y+h;row++,yy+=18){
    const offset=(row%2)*17;
    for(let xx=x+offset;xx<x+w;xx+=34){
      ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx,Math.min(yy+18,y+h));ctx.stroke();
    }
  }

  // sparse moss/shadow chips, deterministic from coordinates
  const seed=Math.floor(x*3+y*5+w*7+h*11);
  for(let i=0;i<10;i++){
    const px=x+6+hash01(seed+i*13)*(w-12);
    const py=y+10+hash01(seed+i*31)*(h-20);
    ctx.fillStyle=i%3===0?'rgba(222,224,221,.055)':'rgba(28,30,31,.10)';
    ctx.fillRect(px,py,3+hash01(seed+i*47)*7,2);
  }
}
function drawInnerCity(x,gy){
  ctx.save();

  // Everything here is behind the main gatehouse and makes the fortress
  // feel like the entrance to a much larger fortified settlement.
  const season=currentSeason();

  // deep inner wall extending out of frame
  const wallY=gy-178;
  const wallW=Math.max(190,x+54);
  const wallGrad=ctx.createLinearGradient(0,0,wallW,0);
  wallGrad.addColorStop(0,'#555a5e');
  wallGrad.addColorStop(.55,'#73787b');
  wallGrad.addColorStop(1,'#51565a');
  ctx.fillStyle=wallGrad;
  ctx.fillRect(-25,wallY,wallW,178);

  // distant wall battlements
  ctx.fillStyle='#4b5054';
  for(let bx=-20;bx<wallW;bx+=27){
    ctx.fillRect(bx,wallY-14,16,17);
  }

  // rooftops and homes inside the walls
  const homes=[
    {dx:-245,base:-202,w:52,h:54,roof:'#6c3c31'},
    {dx:-191,base:-205,w:47,h:65,roof:'#704536'},
    {dx:-139,base:-206,w:59,h:48,roof:'#75412f'},
    {dx:-82, base:-201,w:45,h:61,roof:'#5f3d35'},
    {dx:-35, base:-205,w:53,h:50,roof:'#78452f'}
  ];

  for(let i=0;i<homes.length;i++){
    const h=homes[i];
    const hx=x+h.dx;
    const by=gy+h.base;

    // house body
    const body=ctx.createLinearGradient(hx,0,hx+h.w,0);
    body.addColorStop(0,'#665f55');
    body.addColorStop(.55,'#8b8170');
    body.addColorStop(1,'#58534c');
    ctx.fillStyle=body;
    ctx.fillRect(hx,by-h.h,h.w,h.h);

    // timber
    ctx.fillStyle='#493a2e';
    ctx.fillRect(hx+7,by-h.h,4,h.h);
    ctx.fillRect(hx+h.w-11,by-h.h,4,h.h);
    ctx.fillRect(hx,by-24,h.w,4);

    // roof
    ctx.fillStyle=season.id==='winter'?'#665f61':h.roof;
    ctx.beginPath();
    ctx.moveTo(hx-7,by-h.h);
    ctx.lineTo(hx+h.w*.5,by-h.h-28);
    ctx.lineTo(hx+h.w+7,by-h.h);
    ctx.closePath();ctx.fill();

    if(season.id==='winter'){
      ctx.strokeStyle='rgba(235,242,242,.65)';
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(hx-4,by-h.h-2);
      ctx.lineTo(hx+h.w*.5,by-h.h-28);
      ctx.lineTo(hx+h.w+4,by-h.h-2);
      ctx.stroke();
    }

    // warm windows
    ctx.fillStyle='rgba(255,193,91,.58)';
    ctx.fillRect(hx+14,by-h.h+18,7,10);
    ctx.fillRect(hx+h.w-22,by-h.h+18,7,10);

    // chimney
    if(i%2===0){
      ctx.fillStyle='#4a4540';
      ctx.fillRect(hx+h.w-16,by-h.h-37,7,23);

      // smooth thin smoke, never random blobs
      const sway=Math.sin(time*.55+i)*5;
      ctx.strokeStyle='rgba(113,120,120,.24)';
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(hx+h.w-12,by-h.h-38);
      ctx.bezierCurveTo(
        hx+h.w-16+sway,by-h.h-55,
        hx+h.w-5-sway,by-h.h-67,
        hx+h.w-10+sway*.5,by-h.h-83
      );
      ctx.stroke();
    }
  }

  // inner watchtower / chapel silhouette
  const tx=x-219;
  const ty=gy-304;
  const tower=ctx.createLinearGradient(tx,0,tx+48,0);
  tower.addColorStop(0,'#555a5e');
  tower.addColorStop(.5,'#7e8385');
  tower.addColorStop(1,'#4c5155');
  ctx.fillStyle=tower;
  ctx.fillRect(tx,ty,48,128);

  ctx.fillStyle='#4f3430';
  ctx.beginPath();
  ctx.moveTo(tx-7,ty);
  ctx.lineTo(tx+24,ty-47);
  ctx.lineTo(tx+55,ty);
  ctx.closePath();ctx.fill();

  // bell/window
  ctx.fillStyle='#1e272d';
  rr(tx+16,ty+26,16,30,7);ctx.fill();
  ctx.fillStyle='rgba(255,191,92,.28)';
  ctx.fillRect(tx+21,ty+37,6,10);

  // inner gate arch in the distant city wall
  ctx.fillStyle='#323638';
  ctx.beginPath();
  ctx.moveTo(4,gy);
  ctx.lineTo(4,gy-70);
  ctx.quadraticCurveTo(29,gy-105,54,gy-70);
  ctx.lineTo(54,gy);
  ctx.closePath();ctx.fill();

  // atmospheric shade separates city from foreground gatehouse
  const haze=ctx.createLinearGradient(0,gy-330,0,gy);
  haze.addColorStop(0,'rgba(101,121,128,.12)');
  haze.addColorStop(1,'rgba(25,28,30,.22)');
  ctx.fillStyle=haze;
  ctx.fillRect(-30,gy-350,wallW+40,350);

  ctx.restore();
}

function drawCastle(){
  const x=castleX(),gy=groundY();
  ctx.save();

  drawInnerCity(x,gy);

  // ground shadow
  ctx.fillStyle='rgba(0,0,0,.34)';
  ctx.beginPath();ctx.ellipse(x+40,gy+14,170,24,0,0,TAU);ctx.fill();

  // rear keep
  stoneRect(x-125,gy-248,235,248,'#777a7d');

  // left tower
  stoneRect(x-166,gy-320,78,320,'#85888a');
  // right tower
  stoneRect(x+88,gy-300,80,300,'#828588');

  // battlements
  ctx.fillStyle='#696d70';
  for(let i=0;i<5;i++)ctx.fillRect(x-166+i*17,gy-334,11,22);
  for(let i=0;i<5;i++)ctx.fillRect(x+88+i*18,gy-314,12,22);
  for(let i=0;i<8;i++)ctx.fillRect(x-125+i*31,gy-263,18,22);

  // tower caps/shadows
  ctx.fillStyle='#55595d';
  ctx.fillRect(x-166,gy-322,78,8);
  ctx.fillRect(x+88,gy-302,80,8);

  // flags
  const flap=Math.sin(time*2.3)*3.5;
  ctx.strokeStyle='#4c392a';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(x-137,gy-360);ctx.lineTo(x-137,gy-322);ctx.stroke();
  ctx.fillStyle='#8e2639';ctx.beginPath();
  ctx.moveTo(x-136,gy-357);ctx.lineTo(x-103+flap,gy-350);ctx.lineTo(x-136,gy-341);ctx.closePath();ctx.fill();

  ctx.beginPath();ctx.moveTo(x+130,gy-345);ctx.lineTo(x+130,gy-300);ctx.stroke();
  ctx.fillStyle='#8e2639';ctx.beginPath();
  ctx.moveTo(x+131,gy-342);ctx.lineTo(x+164+flap*.8,gy-334);ctx.lineTo(x+131,gy-324);ctx.closePath();ctx.fill();

  // windows
  function slit(px,py){
    ctx.fillStyle='#1c232a';
    rr(px,py,18,43,8);ctx.fill();
    ctx.fillStyle='rgba(255,192,91,.30)';
    ctx.fillRect(px+5,py+12,8,14);
  }
  slit(x-143,gy-270);
  slit(x+116,gy-250);

  // main arched gate
  const gx=gateX()-42,gw=84,gh=132;
  ctx.fillStyle='#3b2619';
  ctx.beginPath();
  ctx.moveTo(gx,gy);ctx.lineTo(gx,gy-gh+42);
  ctx.quadraticCurveTo(gx+gw/2,gy-gh-7,gx+gw,gy-gh+42);
  ctx.lineTo(gx+gw,gy);ctx.closePath();ctx.fill();

  // wooden planks
  ctx.fillStyle='#4c301c';
  for(let i=0;i<5;i++)ctx.fillRect(gx+i*17,gy-92,13,92);
  ctx.fillStyle='#bd9850';ctx.fillRect(gx,gy-62,gw,8);
  ctx.fillRect(gx,gy-26,gw,6);

  // iron studs
  ctx.fillStyle='#22272c';
  for(let yy=gy-88;yy<gy-12;yy+=28){
    for(let xx=gx+10;xx<gx+gw;xx+=20){
      ctx.beginPath();ctx.arc(xx,yy,2.5,0,TAU);ctx.fill()
    }
  }

  // cracked gate
  const damage=1-game.gateHp/game.gateMax;
  ctx.strokeStyle='#21160f';ctx.lineWidth=3;
  if(damage>.20){
    ctx.beginPath();ctx.moveTo(gx+20,gy-80);ctx.lineTo(gx+33,gy-63);ctx.lineTo(gx+23,gy-42);ctx.stroke()
  }
  if(damage>.45){
    ctx.beginPath();ctx.moveTo(gx+62,gy-105);ctx.lineTo(gx+49,gy-78);ctx.lineTo(gx+64,gy-55);ctx.stroke()
  }
  if(damage>.70){
    ctx.beginPath();ctx.moveTo(gx+38,gy-45);ctx.lineTo(gx+51,gy-31);ctx.lineTo(gx+40,gy-10);ctx.stroke()
  }

  // torch
  ctx.fillStyle='#4b321f';ctx.fillRect(x-102,gy-150,5,24);
  const flame=Math.sin(time*7)*1.2;
  ctx.fillStyle='#ff8a32';
  ctx.beginPath();
  ctx.moveTo(x-105,gy-151);
  ctx.quadraticCurveTo(x-104,gy-162-flame,x-99,gy-166);
  ctx.quadraticCurveTo(x-94,gy-160+flame,x-93,gy-151);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffd05a';
  ctx.beginPath();
  ctx.moveTo(x-102,gy-152);
  ctx.quadraticCurveTo(x-101,gy-159,x-99,gy-161);
  ctx.quadraticCurveTo(x-96,gy-157,x-96,gy-152);
  ctx.closePath();ctx.fill();

  // CASTLE EVOLUTION: every level visibly changes the silhouette.
  if(game.castleLevel>=2){
    ctx.fillStyle='#555b5f';
    ctx.fillRect(x-126,gy-275,235,10);
    for(let i=0;i<8;i++)ctx.fillRect(x-122+i*30,gy-289,15,17);

    // stronger gate frame
    ctx.fillStyle='#383d40';
    ctx.fillRect(gx+7,gy-104,6,104);
    ctx.fillRect(gx+gw-13,gy-104,6,104);
  }

  if(game.castleLevel>=3){
    // outer bastions and curtain walls
    stoneRect(x-211,gy-245,45,245,'#707477');
    stoneRect(x+168,gy-240,46,240,'#707477');

    ctx.fillStyle='#4c5155';
    for(let i=0;i<3;i++){
      ctx.fillRect(x-211+i*16,gy-260,10,19);
      ctx.fillRect(x+168+i*16,gy-255,10,19);

function drawArcherUnit(x,feetY,flip=false,level=1,phase=0){
  const bob=Math.sin(time*3.1+phase)*.45;
  ctx.save();
  ctx.translate(x,feetY-29+bob);
  if(flip)ctx.scale(-1,1);

  // ground contact
  ctx.fillStyle='rgba(0,0,0,.30)';
  ctx.beginPath();ctx.ellipse(0,29,14,3,0,0,TAU);ctx.fill();

  // legs + boots
  ctx.fillStyle=level>=4?'#24292d':'#31302d';
  ctx.fillRect(-8,13,6,13);ctx.fillRect(3,13,6,13);
  ctx.fillStyle='#151515';
  ctx.fillRect(-10,24,10,5);ctx.fillRect(3,24,10,5);

  // Tunic/armor palette changes strongly by level.
  const palettes=[
    null,
    ['#283a2b','#466044','#253128'],
    ['#203426','#527047','#26362b'],
    ['#27333a','#66757b','#27343a'],
    ['#542b23','#93432d','#382722'],
    ['#203948','#39738d','#18313f']
  ];
  const p=palettes[Math.min(level,5)]||palettes[5];
  const tunic=ctx.createLinearGradient(-14,0,14,0);
  tunic.addColorStop(0,p[0]);tunic.addColorStop(.52,p[1]);tunic.addColorStop(1,p[2]);
  ctx.fillStyle=tunic;
  ctx.beginPath();
  ctx.moveTo(-11,-8);ctx.lineTo(11,-8);ctx.lineTo(14,15);ctx.lineTo(-14,15);ctx.closePath();ctx.fill();

  // cape appears from level 2, dramatically changes silhouette.
  if(level>=2){
    ctx.fillStyle=level>=5?'#214e63':level===4?'#6d2d25':'#31442f';
    ctx.beginPath();
    ctx.moveTo(-10,-5);ctx.lineTo(-17,18);ctx.lineTo(-7,15);ctx.lineTo(-3,-2);ctx.closePath();ctx.fill();
  }

  // leather / metal armor by level
  if(level===1){
    ctx.fillStyle='#69452b';
    ctx.beginPath();ctx.ellipse(-9,-4,7,5,-.3,0,TAU);ctx.fill();
  }
  if(level===2){
    ctx.fillStyle='#6b4a2d';
    ctx.fillRect(-12,-5,24,5);
    ctx.beginPath();ctx.ellipse(-10,-4,7,6,-.25,0,TAU);ctx.fill();
  }
  if(level>=3){
    ctx.fillStyle=level>=5?'#77aabd':'#858d91';
    ctx.beginPath();ctx.ellipse(-10,-4,8,6,-.25,0,TAU);ctx.fill();
    ctx.beginPath();ctx.ellipse(10,-4,8,6,.25,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.18)';
    ctx.fillRect(-10,-7,20,2);
  }
  if(level>=4){
    ctx.fillStyle=level>=5?'#315f73':'#7e3929';
    ctx.fillRect(-14,3,28,5);
  }

  // belt
  ctx.fillStyle='#51341f';ctx.fillRect(-13,7,26,4);
  ctx.fillStyle=level>=3?'#d0b766':'#aa914f';ctx.fillRect(-2,7,4,4);

  // neck/head
  ctx.fillStyle='#d7aa7e';ctx.fillRect(-3,-11,6,5);
  ctx.beginPath();ctx.arc(0,-18,9,0,TAU);ctx.fill();
  ctx.fillStyle='#b98768';ctx.fillRect(6,-18,3,3);
  ctx.fillStyle='rgba(84,55,41,.22)';ctx.fillRect(-7,-13,14,3);

  // Headgear changes entirely.
  if(level===1){
    ctx.fillStyle='#4b5b3e';
    ctx.beginPath();ctx.arc(0,-20,10,Math.PI,TAU);ctx.lineTo(8,-11);ctx.lineTo(-7,-11);ctx.closePath();ctx.fill();
  }else if(level===2){
    ctx.fillStyle='#28412d';
    ctx.beginPath();ctx.arc(0,-20,10,Math.PI,TAU);ctx.lineTo(8,-11);ctx.lineTo(-7,-11);ctx.closePath();ctx.fill();
    ctx.fillStyle='#3d5839';ctx.fillRect(-11,-22,22,4);
  }else if(level===3){
    ctx.fillStyle='#687174';
    ctx.beginPath();ctx.arc(0,-21,10,Math.PI,TAU);ctx.lineTo(9,-13);ctx.lineTo(-9,-13);ctx.closePath();ctx.fill();
    ctx.fillStyle='#3b4448';ctx.fillRect(-11,-20,22,3);
  }else if(level===4){
    ctx.fillStyle='#772f25';
    ctx.beginPath();ctx.arc(0,-20,10,Math.PI,TAU);ctx.lineTo(8,-11);ctx.lineTo(-8,-11);ctx.closePath();ctx.fill();
    ctx.fillStyle='#d38b3f';
    ctx.beginPath();ctx.moveTo(-3,-29);ctx.lineTo(1,-38);ctx.lineTo(5,-28);ctx.closePath();ctx.fill();
  }else{
    ctx.fillStyle='#225268';ctx.shadowBlur=5;ctx.shadowColor='#6ac8ee';
    ctx.beginPath();ctx.arc(0,-20,10,Math.PI,TAU);ctx.lineTo(8,-11);ctx.lineTo(-8,-11);ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#79cbe8';ctx.fillRect(-10,-21,20,2);
  }

  // arm
  ctx.strokeStyle='#d7aa7e';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(8,-3);ctx.lineTo(17,3);ctx.stroke();

  // Bow also upgrades visually.
  ctx.strokeStyle=level>=5?'#87d8ee':level===4?'#bf7541':level>=3?'#c4a15d':'#986a39';
  ctx.lineWidth=level>=3?2.7:2.1;
  ctx.beginPath();ctx.arc(19,1,15,-1.32,1.32);ctx.stroke();

  if(level>=3){
    ctx.strokeStyle=level>=5?'#5b9fb5':'#70797b';
    ctx.lineWidth=1.3;
    ctx.beginPath();ctx.arc(19,1,12,-1.28,1.28);ctx.stroke();
  }

  ctx.strokeStyle='#e8dfca';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(23,-13);ctx.lineTo(23,15);ctx.stroke();

  // quiver
  ctx.fillStyle=level>=4?'#42261f':'#5e3b24';ctx.fillRect(-15,-5,6,19);
  const shaft=level>=5?'#74c8e8':level===4?'#bd6941':level>=3?'#cbd9dc':'#c2a572';
  ctx.strokeStyle=shaft;ctx.lineWidth=1.4;
  for(let i=0;i<3;i++){
    ctx.beginPath();ctx.moveTo(-14+i*2,-7);ctx.lineTo(-11+i*2,-19);ctx.stroke();
  }

  // upgrade aura only at maximum visual tier
  if(level>=5){
    ctx.strokeStyle='rgba(112,210,244,.42)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(0,-2,21+Math.sin(time*3+phase)*2,0,TAU);ctx.stroke();
  }

  ctx.restore();
}

function drawLavaTrap(x,gy){
  const bx=gateX()+16,by=gy-178;

  // Support frame
  ctx.strokeStyle='#47301f';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(bx-36,by-46);ctx.lineTo(bx-36,by+18);ctx.stroke();
  ctx.beginPath();ctx.moveTo(bx-36,by-43);ctx.lineTo(bx+20,by-43);ctx.stroke();

  // pulley
  ctx.fillStyle='#3a3e40';
  ctx.beginPath();ctx.arc(bx+9,by-43,6,0,TAU);ctx.fill();
  ctx.strokeStyle='#1f2425';ctx.lineWidth=2;ctx.stroke();

  // Animation progression: 0 rest, then tip, pour, return.
  const active=game.lavaPour>0;
  const total=1.35;
  const elapsed=active?total-game.lavaPour:0;
  let tilt=0;
  let pourStrength=0;

  if(active){
    if(elapsed<.28){
      tilt=(elapsed/.28)*1.0;
      pourStrength=elapsed/.28*.35;
    }else if(elapsed<.92){
      tilt=1.0;
      pourStrength=1;
    }else{
      const r=(elapsed-.92)/(total-.92);
      tilt=1-r;
      pourStrength=1-r;
    }
  }

  // chain responds to bucket movement
  const pivotX=bx+9,pivotY=by-43;
  const bucketCX=bx+13+Math.sin(tilt)*10;
  const bucketCY=by-8+Math.sin(tilt*.8)*4;

  ctx.strokeStyle='#34383a';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(pivotX,pivotY+5);ctx.lineTo(bucketCX,bucketCY-20);ctx.stroke();

  // bucket rotates around its handle
  ctx.save();
  ctx.translate(bucketCX,bucketCY);
  ctx.rotate(tilt*.92);

  const metal=ctx.createLinearGradient(-22,0,22,0);
  metal.addColorStop(0,'#24292b');
  metal.addColorStop(.5,'#555b5e');
  metal.addColorStop(1,'#262b2d');
  ctx.fillStyle=metal;
  ctx.beginPath();
  ctx.moveTo(-21,-17);ctx.lineTo(21,-17);ctx.lineTo(15,18);ctx.lineTo(-15,18);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#181c1d';ctx.lineWidth=2;ctx.stroke();

  // rim
  ctx.fillStyle='#1e2224';
  ctx.fillRect(-22,-19,44,5);

  // glowing lava inside
  ctx.fillStyle='#ff652a';
  ctx.beginPath();ctx.ellipse(0,-17,18,5,0,0,TAU);ctx.fill();
  ctx.fillStyle='#ffd45c';
  ctx.beginPath();ctx.ellipse(-4,-18,7,2.4,0,0,TAU);ctx.fill();

  // handle
  ctx.strokeStyle='#303538';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,-15,25,Math.PI,TAU);ctx.stroke();

  ctx.restore();

  // Continuous lava stream during middle of animation
  if(active&&pourStrength>.18){
    const mouthX=bucketCX+23*Math.cos(tilt*.92);
    const mouthY=bucketCY-7+23*Math.sin(tilt*.92);
    const targetX=gateX()+86;
    const targetY=groundY()-3;

    ctx.save();
    ctx.globalAlpha=.78+.18*Math.sin(time*15);
    ctx.strokeStyle='#ff632a';
    ctx.lineWidth=7*pourStrength;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(mouthX,mouthY);
    ctx.bezierCurveTo(
      mouthX+12,mouthY+34,
      targetX-20,targetY-38,
      targetX,targetY
    );
    ctx.stroke();

    ctx.strokeStyle='#ffd050';
    ctx.lineWidth=3.1*pourStrength;
    ctx.beginPath();
    ctx.moveTo(mouthX,mouthY);
    ctx.bezierCurveTo(
      mouthX+12,mouthY+34,
      targetX-20,targetY-38,
      targetX,targetY
    );
    ctx.stroke();
    ctx.restore();

    // glowing pool
    ctx.fillStyle=`rgba(255,91,37,${.26*pourStrength})`;
    ctx.beginPath();ctx.ellipse(targetX,targetY+4,50*pourStrength,9,0,0,TAU);ctx.fill();
  }
}

function drawStone(s){
  if(s.cx==null)return;

  const size=s.size||(s.side==='player'?16:13);
  const dx=s.tx-s.x,dy=s.ty-s.y,len=Math.hypot(dx,dy)||1;
  const nx=dx/len,ny=dy/len;

  ctx.save();
  ctx.globalAlpha=.30;
  ctx.strokeStyle=s.side==='player'?'#d9c9aa':'#9c9182';
  ctx.lineWidth=Math.max(3,size*.45);
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(s.cx-nx*size*3.3,s.cy-ny*size*3.3);
  ctx.lineTo(s.cx-nx*size*.8,s.cy-ny*size*.8);
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle='rgba(0,0,0,.24)';
  ctx.beginPath();ctx.arc(s.cx+3,s.cy+4,size+4,0,TAU);ctx.fill();

  const rock=ctx.createRadialGradient(s.cx-size*.35,s.cy-size*.4,2,s.cx,s.cy,size);
  rock.addColorStop(0,s.side==='player'?'#aaa392':'#817c73');
  rock.addColorStop(.45,s.side==='player'?'#77736b':'#57534e');
  rock.addColorStop(1,'#32312f');
  ctx.fillStyle=rock;
  ctx.beginPath();ctx.arc(s.cx,s.cy,size,0,TAU);ctx.fill();

  ctx.fillStyle='rgba(255,255,255,.15)';
  ctx.beginPath();ctx.arc(s.cx-size*.34,s.cy-size*.35,size*.28,0,TAU);ctx.fill();
}
