<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Castle Defense — Reforged</title>
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="hudSide">
        <div class="pill">🏰 Ворота: <span id="hp">300/300</span></div>
        <div class="pill">🌊 Хвиля: <span id="wave">1</span></div>
        <div class="pill">🍃 <span id="seasonLabel">Весна</span></div>
        <div class="pill" title="HP артилерійських платформ. При 0 HP вимикаються тільки балліста та катапульта.">🧱 Артилерія: <span id="towerHp">180/180</span></div>
        <div id="perkBar" class="perkBar"></div>
        <div class="pill">⚔️ <span id="eventLabel">Звичайна хвиля</span></div>
      </div>
      <div class="hudSide">
        <div id="speedControls">
          <button class="speedBtn active" data-speed="1" onclick="setGameSpeed(1)">×1</button>
          <button class="speedBtn" data-speed="2" onclick="setGameSpeed(2)">×2</button>
          <button class="speedBtn" data-speed="4" onclick="setGameSpeed(4)">×4</button>
          <button class="speedBtn" data-speed="12" onclick="setGameSpeed(12)" title="Тестовий режим">×12</button>
        </div>
        <div class="pill gold">🪙 <span id="gold">220</span></div>
        <div class="pill">💀 <span id="kills">0</span></div>
      </div>
    </div>

    <div id="message"></div>
    <div id="waveBanner"></div>

    <div id="bossWrap">
      <div id="bossTitle">👑 WARLORD GOBLIN</div>
      <div class="bossBar"><div id="bossFill"></div></div>
    </div>

    <div id="rewardOverlay" class="rewardOverlay">
      <div class="rewardCard">
        <div class="rewardTitle">Скриня боса</div>
        <div class="rewardSub">Обери один постійний бонус</div>
        <div id="rewardChoices" class="rewardChoices"></div>
      </div>
    </div>

    <div id="overlay">
      <div class="card">
        <h1>Замок пав</h1>
        <p id="resultText"></p>
        <button class="mainBtn" onclick="restartGame()">⚔️ Спробувати ще раз</button>
      </div>
    </div>
  </div>

  <div id="shopPanel">
    <div id="shopTabs">
      <button class="shopTab active" data-tab="army" onclick="setShopTab('army')">⚔️ Війська</button>
      <button class="shopTab" data-tab="defense" onclick="setShopTab('defense')">🛡️ Оборона</button>
      <button class="shopTab" data-tab="castle" onclick="setShopTab('castle')">🏰 Фортеця</button>
    </div>

    <div id="shop">
      <div class="shopGroup active" data-shop-group="army">
        <button id="archerBtn" onclick="buyArcher()"></button>
        <button id="archerUpBtn" onclick="upgradeArchers()"></button>
        <button id="archerCommanderBtn" onclick="buyArcherCommander()"></button>
        <button id="mageBtn" onclick="buyMage()"></button>
        <button id="knightsBtn" onclick="deployKnights()"></button>
        <button id="techBtn" onclick="buyTech()"></button>
      </div>

      <div class="shopGroup" data-shop-group="defense">
        <button id="riverBtn" onclick="buyRiver()"></button>
        <button id="lavaBtn" onclick="buyLava()"></button>
        <button id="oilBtn" onclick="buyOil()"></button>
        <button id="trapsBtn" onclick="buyTraps()"></button>
        <button id="gateBtn" onclick="buyGate()"></button>
        <button id="repairBtn" onclick="repairGate()"></button>
      </div>

      <div class="shopGroup" data-shop-group="castle">
        <button id="ballistaBtn" onclick="buyBallista()"></button>
        <button id="catapultBtn" onclick="buyCatapult()"></button>
        <button id="towerRepairBtn" onclick="repairTowers()"></button>
        <button id="castleBtn" onclick="upgradeCastle()"></button>
      </div>
    </div>
  </div>
</div>

<script src="scripts/core.js"></script>
<script src="scripts/balance.js"></script>
<script src="scripts/visuals.js"></script>
<script src="scripts/render-night.js"></script>
<script src="scripts/game-state.js"></script>
<script src="scripts/simulation.js"></script>
<script src="scripts/economy-ui.js"></script>
<script src="scripts/render-world.js"></script>
<script src="scripts/render-units.js"></script>
<script src="scripts/render-effects.js"></script>
<script src="scripts/main.js"></script>
</body>
</html>
